set -g default-terminal "xterm-256color"
set -g history-limit 10000
set -g mouse on

set -g prefix C-b
set -g prefix2 C-b
set -g base-index 0

# Sections taken from Steve Dee's dotfile:
# intuitive window-splitting keys
bind-key "|" split-window -h
bind-key "\\" split-window -h
bind-key "-" split-window -v

# Pass through Ctrl-a and Ctrl-e properly
# https://stackoverflow.com/a/55616731
bind -n Home send-key Escape "OH"
bind -n End send-key Escape "OF"

# status bar
set -g status-left-length 20
set -g status-left "#[fg=green][#S] "
set -g status-style "bg=colour234 fg=white"
set -g status-right '#[fg=green]#(whoami)'

# Sizing
bind -r C-h resize-pane -L 10
bind -r C-l resize-pane -R 10
bind -r C-j resize-pane -D 10
bind -r C-k resize-pane -U 10

# Navigation
bind l select-window -l
bind -r ^b select-pane -R

set -g set-titles on
set -g set-titles-string "[#S] #I:#W"

# use vim navigation between panes
# see: https://github.com/alexghergh/nvim-tmux-navigation?tab=readme-ov-file#tmux
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

bind / copy-mode
